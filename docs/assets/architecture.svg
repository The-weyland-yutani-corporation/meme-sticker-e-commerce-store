<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">Meme Forge application and governed delivery architecture</title>
  <desc id="description">A browser calls Next.js on Azure App Service. The VNet-integrated app uses private endpoints for PostgreSQL and Key Vault. Managed identity resolves secrets. Azure Monitor observes the app. Separately GitHub Actions uses OIDC for Azure deployment, subject to repository checks and an external organization governance kernel. Release blobs use private storage; GitHub retains immutable package artifacts.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a4ff4f"/></marker>
    <style>text{font-family:Arial,Helvetica,sans-serif;fill:#f4f5ef} .heading{font-size:25px;font-weight:bold}.label{font-size:18px;font-weight:bold}.small{font-size:15px;fill:#b8c4bb}.box{fill:#1b201c;stroke:#617267;stroke-width:2;rx:12}.flow{fill:none;stroke:#a4ff4f;stroke-width:2;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="760" fill="#080a08"/>
  <text x="35" y="43" class="heading">MEME FORGE / architecture and trust boundaries</text>
  <text x="35" y="72" class="small">Reference design, not proof of a live deployment. Payments disabled; fulfillment mocked.</text>
  <rect x="25" y="100" width="1150" height="310" fill="#101a22" stroke="#4083b5" rx="16"/>
  <text x="45" y="130" class="label">Application plane / Azure resource group</text>
  <rect x="45" y="170" width="180" height="100" class="box"/>
  <text x="65" y="203" class="label">Browser</text><text x="65" y="230" class="small">Catalog → cart</text><text x="65" y="252" class="small">Payment-free checkout</text>
  <rect x="295" y="170" width="255" height="120" class="box"/>
  <text x="315" y="204" class="label">Next.js / App Service</text><text x="315" y="233" class="small">Validate input; price on server</text><text x="315" y="257" class="small">Order service → Prisma + pg</text><text x="315" y="278" class="small">VNet integration</text>
  <rect x="650" y="150" width="240" height="105" class="box"/>
  <text x="670" y="183" class="label">PostgreSQL</text><text x="670" y="211" class="small">Private endpoint + DNS</text><text x="670" y="234" class="small">Orders + line items</text>
  <rect x="650" y="285" width="240" height="100" class="box"/>
  <text x="670" y="318" class="label">Key Vault</text><text x="670" y="346" class="small">Private endpoint + DNS</text><text x="670" y="368" class="small">Database / probe secrets</text>
  <rect x="945" y="170" width="205" height="120" class="box"/>
  <text x="960" y="203" class="label">Azure Monitor</text><text x="960" y="232" class="small">Application Insights</text><text x="960" y="255" class="small">Log Analytics + alerts</text>
  <path d="M225 213H295" class="flow"/><text x="237" y="198" class="small">HTTPS</text>
  <path d="M550 200H650" class="flow"/><text x="565" y="185" class="small">DB / TLS</text>
  <path d="M490 290V335H650" class="flow"/><text x="305" y="365" class="small">Managed identity → Key Vault references</text>
  <path d="M550 266H595V140H1045V170" class="flow"/>
  <rect x="25" y="435" width="1150" height="250" fill="#191427" stroke="#8d73be" rx="16"/>
  <text x="45" y="465" class="label">Delivery plane / GitHub (optional factory requires external governance)</text>
  <rect x="45" y="490" width="240" height="110" class="box"/>
  <text x="65" y="520" class="label">Issues → bounded PRs</text><text x="65" y="547" class="small">Policy, independent reviews</text><text x="65" y="573" class="small">External kernel + rulesets</text>
  <rect x="365" y="490" width="300" height="110" class="box"/>
  <text x="385" y="520" class="label">Checks → release controller</text><text x="385" y="547" class="small">Node 22 / 24, real DB acceptance</text><text x="385" y="573" class="small">OIDC → Azure deployment identity</text>
  <rect x="770" y="490" width="380" height="110" class="box"/>
  <text x="790" y="520" class="label">Packages and deployment evidence</text><text x="790" y="547" class="small">GitHub artifacts; private Azure Blob Storage</text><text x="790" y="573" class="small">Health / synthetic checks; previous-package recovery</text>
  <path d="M285 540H365" class="flow"/><path d="M665 540H770" class="flow"/>
  <path d="M515 490V425H420V290" class="flow"/>
  <text x="45" y="643" class="small">No staging slot in the current topology. Database migrations must remain backward-compatible.</text>
  <text x="35" y="725" class="small">Local demo: browser → Next.js → disposable PostgreSQL; no Azure credentials or delivery factory needed.</text>
</svg>
