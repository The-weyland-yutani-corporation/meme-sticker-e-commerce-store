  evidence: docs/assets/evidence.json
engagement:
  offer: "Commerce and governed-delivery discovery workshop"
  pilot: "Adapt one synthetic journey in approved nonproduction infrastructure"
  outcome: "Verified order journey and traceable change-to-deployment evidence"
limitations:
  - "Next.js canary dependency; no stable-only stack claim"
  - "No active payments, real fulfillment, customer identity or inventory integration"
  - "Generic confirmation page does not independently verify persistence"
  - "Local evidence does not prove a live Azure deployment"
  - "Current Azure topology has no staging slot; application rollback does not undo migrations"
  - "Public checkout abuse controls require pilot-specific assessment"
  - "Development dependency advisories remain; production audit is clean at capture"
