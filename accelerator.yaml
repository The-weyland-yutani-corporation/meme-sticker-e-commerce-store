id: meme-forge
name: "Meme Forge — Azure Commerce and Governed Delivery Accelerator"
summary: "Payment-free commerce with PostgreSQL persistence and governed Azure delivery patterns."
description: >-
  A Next.js reference storefront connecting catalog selection, server-side pricing,
  and persisted test orders. Includes Azure infrastructure, local acceptance tests,
  presenter assets and a customer discovery kit. Payments are disabled and fulfillment
  is mocked. Agentic capabilities concern software delivery, not runtime shopping AI.
repository: "https://github.com/The-weyland-yutani-corporation/meme-sticker-e-commerce-store"
catalog: "https://github.com/mcaps-microsoft/accelerators-catalog"
status: draft
schema_verified: false
readiness: locally-verified-demo-candidate
target_readiness: catalog-ready
customer_scope: reusable-cross-industry
industries: [retail, cross-industry]
personas: [platform-engineering-lead, developer, product-owner, solution-engineer, cloud-solution-architect]
scenarios: [commerce-modernization, governed-software-delivery, azure-application-modernization]
technologies: [Next.js, TypeScript, React, PostgreSQL, Prisma, GitHub Actions, GitHub Agentic Workflows, Azure Bicep]
azure_services:
  - Azure App Service
  - Azure Database for PostgreSQL
  - Azure Key Vault
  - Azure Blob Storage
  - Azure Monitor
  - Azure Application Insights
  - Azure Private Link
capabilities: [product-catalog, shopping-cart, payment-free-order-persistence, database-backed-health, synthetic-order-verification]
prerequisites:
  - "Node 22.13+ or Node 24 and npm"
  - "PostgreSQL 16 for checkout; disposable _test database for acceptance"
  - "Approved Azure subscription and owner bootstrap for optional cloud deployment"
  - "External organization governance and repository administration for optional unattended factory"
