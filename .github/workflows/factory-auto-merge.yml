name: Factory auto-merge

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    name: Enable auto-merge
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      startsWith(github.event.pull_request.head.ref, 'factory/') &&
      startsWith(github.event.pull_request.title, '[factory] ') &&
      contains(github.event.pull_request.labels.*.name, 'factory:managed') &&
      contains(github.event.pull_request.labels.*.name, 'factory:reviewed') &&
      contains(github.event.pull_request.labels.*.name, 'factory:security-reviewed')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enable squash auto-merge for the reviewed head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          gh pr merge "$PR_URL"
          --auto
          --squash
          --match-head-commit "$HEAD_SHA"
