name: CI

on:
  pull_request:
  workflow_dispatch:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: meme_demo
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: meme_forge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meme_demo -d meme_forge_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/meme_forge
      APP_URL: http://localhost:3000
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Apply committed migrations and verify real checkout
        env:
          DATABASE_URL: postgresql://meme_demo:${{ 'local-ci-only' }}@localhost:5432/meme_forge_test
          TEST_DATABASE_URL: postgresql://meme_demo:${{ 'local-ci-only' }}@localhost:5432/meme_forge_test
        run: |
          npm run db:migrate
          npm run db:seed
          npx vitest run tests/database.integration.test.ts

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

  validate-required:
    name: Validate
    if: always()
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Require both supported runtimes
        env:
          RESULT: ${{ needs.validate.result }}
        run: test "$RESULT" = success
