name: Factory work lifecycle

on:
  pull_request:
    types: [opened, closed]
  workflow_run:
    workflows: ["Factory implementer"]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: factory-work-lifecycle
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile issue and pull request state
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Reconcile factory lifecycle
        shell: bash
        run: |
          set -euo pipefail

          function linked_issues() {
            local pr_number="$1"
            gh pr view "$pr_number" \
              --repo "$REPOSITORY" \
              --json closingIssuesReferences \
              --jq '.closingIssuesReferences[].number'
          }

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if ! jq -e '.pull_request.labels[].name | select(. == "factory:managed")' \
              "$GITHUB_EVENT_PATH" >/dev/null; then
              exit 0
            fi

            pr_number="${{ github.event.pull_request.number }}"
            while read -r issue_number; do
              [ -n "$issue_number" ] || continue
              if [ "${{ github.event.action }}" = "opened" ]; then
                gh issue edit "$issue_number" \
                  --repo "$REPOSITORY" \
                  --remove-label "factory:ready" \
                  --remove-label "factory:repair" \
                  --add-label "factory:active"
              elif [ "${{ github.event.pull_request.merged }}" = "false" ]; then
                gh issue edit "$issue_number" \
                  --repo "$REPOSITORY" \
                  --remove-label "factory:active" \
                  --add-label "factory:repair"
                gh issue comment "$issue_number" \
                  --repo "$REPOSITORY" \
                  --body "Factory PR #$pr_number closed without merge; work returned to the repair queue."
              else
                gh issue edit "$issue_number" \
                  --repo "$REPOSITORY" \
                  --remove-label "factory:active" || true
              fi
            done < <(linked_issues "$pr_number")
            exit 0
          fi

          active_run_count="$(
            gh run list \
              --repo "$REPOSITORY" \
              --workflow "factory-implement.lock.yml" \
              --limit 20 \
              --json status \
              --jq '[
                .[] |
                select(
                  .status == "queued" or
                  .status == "in_progress" or
                  .status == "waiting" or
                  .status == "requested" or
                  .status == "pending"
                )
              ] | length'
          )"
          if [ "$active_run_count" -gt 0 ]; then
            echo "Another implementer run is active; deferring issue cleanup."
            exit 0
          fi

          active_issues="$(
            gh issue list \
              --repo "$REPOSITORY" \
              --state open \
              --label "factory:active" \
              --limit 100 \
              --json number \
              --jq '.[].number'
          )"
          open_pr_bodies="$(
            gh pr list \
              --repo "$REPOSITORY" \
              --state open \
              --label "factory:managed" \
              --limit 100 \
              --json body \
              --jq '.[].body'
          )"

          while read -r issue_number; do
            [ -n "$issue_number" ] || continue
            if ! grep -Eiq "(close[sd]?|fix(e[sd])?|resolve[sd]?) +#$issue_number([^0-9]|$)" \
              <<<"$open_pr_bodies"; then
              gh issue edit "$issue_number" \
                --repo "$REPOSITORY" \
                --remove-label "factory:active"
              gh issue comment "$issue_number" \
                --repo "$REPOSITORY" \
                --body "Implementer run ${{ github.event.workflow_run.html_url }} completed with conclusion \`${{ github.event.workflow_run.conclusion }}\` without opening a linked PR; the issue is eligible for its next bounded attempt."
            fi
          done <<<"$active_issues"
