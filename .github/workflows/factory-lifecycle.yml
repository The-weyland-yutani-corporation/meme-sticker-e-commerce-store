name: Factory work lifecycle

on:
  pull_request:
    types: [opened, closed]
  schedule:
    - cron: "1,6,11,16,21,26,31,36,41,46,51,56 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: factory-work-lifecycle
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile issue and pull request state
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Reconcile factory lifecycle
        shell: bash
        run: |
          set -euo pipefail

          function provenance_issue() {
            local pr_number="$1"
            gh api \
              --paginate \
              --slurp \
              "repos/$REPOSITORY/issues/$pr_number/comments" |
            jq -r '
              [
                .[][] |
                select(.user.login == "github-actions[bot]") |
                .body |
                try capture(
                  "FACTORY_PROVENANCE issue=(?<issue>[0-9]+) run=[0-9]+"
                ).issue catch empty
              ] |
              last // empty
            '
          }

          function comment_once() {
            local issue_number="$1"
            local marker="$2"
            local body="$3"
            if gh api \
              --paginate \
              "repos/$REPOSITORY/issues/$issue_number/comments" \
              --jq --arg marker "$marker" '
                any(
                  .[];
                  .user.login == "github-actions[bot]" and
                  (.body | contains($marker))
                )
              ' | grep -Fqx "true"; then
              return 0
            fi
            gh issue comment "$issue_number" \
              --repo "$REPOSITORY" \
              --body "$body

          $marker" >/dev/null
          }

          function failed_validation_run() {
            local head_ref="$1"
            local head_sha="$2"
            local workflow runs failure
            for workflow in ci.yml codeql.yml; do
              runs="$(
                gh run list \
                  --repo "$REPOSITORY" \
                  --workflow "$workflow" \
                  --branch "$head_ref" \
                  --limit 30 \
                  --json event,headSha,status,conclusion,url
              )"
              failure="$(
                jq -r --arg sha "$head_sha" '
                  [
                    .[] |
                    select(.event == "workflow_dispatch") |
                    select(.headSha == $sha)
                  ][0] as $run |
                  if (
                    $run.status == "completed" and
                    $run.conclusion == "failure"
                  ) then
                    $run.url
                  else
                    empty
                  end
                ' <<<"$runs"
              )"
              if [ -n "$failure" ]; then
                printf '%s\n' "$failure"
                return 0
              fi
            done
            return 1
          }

          gh pr list \
            --repo "$REPOSITORY" \
            --state all \
            --label "factory:managed" \
            --limit 100 \
            --json number,state,mergedAt,headRefName,headRefOid \
            --jq '.[] | [.number, .state, (.mergedAt // ""), .headRefName, .headRefOid] | @tsv' |
          while IFS=$'\t' read -r pr_number state merged_at head_ref head_sha; do
            [ -n "$pr_number" ] || continue
            issue_number="$(provenance_issue "$pr_number")"
            [ -n "$issue_number" ] || continue

            if [ -n "$merged_at" ]; then
              gh issue edit "$issue_number" \
                --repo "$REPOSITORY" \
                --remove-label "factory:active" \
                --remove-label "factory:ready" \
                --remove-label "factory:repair" || true
              issue_state="$(
                gh issue view "$issue_number" \
                  --repo "$REPOSITORY" \
                  --json state \
                  --jq '.state'
              )"
              if [ "$issue_state" = "OPEN" ]; then
                gh issue close "$issue_number" \
                  --repo "$REPOSITORY" \
                  --comment "Factory PR #$pr_number merged after current-head deterministic checks and independent reviews." >/dev/null
              fi
            elif [ "$state" = "OPEN" ]; then
              if failed_run="$(failed_validation_run "$head_ref" "$head_sha")"; then
                gh issue edit "$issue_number" \
                  --repo "$REPOSITORY" \
                  --remove-label "factory:active" \
                  --remove-label "factory:ready" \
                  --add-label "factory:repair" >/dev/null
                comment_once \
                  "$issue_number" \
                  "<!-- FACTORY_REPAIR_CHECKS: $pr_number $head_sha -->" \
                  "Factory PR #$pr_number failed exact-head deterministic validation and returned to the bounded repair queue.

          Failed run: $failed_run"
                gh pr close "$pr_number" \
                  --repo "$REPOSITORY" \
                  --comment "Closed by lifecycle reconciliation after exact-head deterministic validation failed. Linked work has returned to the bounded repair queue." >/dev/null
              else
                gh issue edit "$issue_number" \
                  --repo "$REPOSITORY" \
                  --remove-label "factory:ready" \
                  --remove-label "factory:repair" \
                  --add-label "factory:active" >/dev/null
              fi
            else
              gh issue edit "$issue_number" \
                --repo "$REPOSITORY" \
                --remove-label "factory:active" \
                --remove-label "factory:ready" \
                --add-label "factory:repair" >/dev/null
              comment_once \
                "$issue_number" \
                "<!-- FACTORY_REPAIR_PR: $pr_number -->" \
                "Factory PR #$pr_number closed without merge; work returned to the bounded repair queue."
            fi
          done

          all_pr_bodies="$(
            gh pr list \
              --repo "$REPOSITORY" \
              --state all \
              --label "factory:managed" \
              --limit 100 \
              --json body \
              --jq '.[].body // ""'
          )"
          gh issue list \
            --repo "$REPOSITORY" \
            --state open \
            --label "factory:active" \
            --limit 100 \
            --json number,comments \
            --jq '.[] | [.number, (.comments | map(.body) | join("\n"))] | @base64' |
          while read -r encoded; do
            [ -n "$encoded" ] || continue
            issue="$(
              base64 --decode <<<"$encoded" |
              jq '{number: .[0], comments: .[1]}'
            )"
            issue_number="$(jq -r '.number' <<<"$issue")"
            run_id="$(
              jq -r '
                .comments |
                [
                  try scan("FACTORY_IMPLEMENT_RUN: ([0-9]+)")[] catch empty
                ] |
                last // empty
              ' <<<"$issue"
            )"
            [ -n "$run_id" ] || continue
            if grep -Fq "id: $run_id, workflow_id: factory-implement" \
              <<<"$all_pr_bodies"; then
              continue
            fi

            run="$(
              gh api "repos/$REPOSITORY/actions/runs/$run_id" 2>/dev/null ||
                true
            )"
            [ -n "$run" ] || continue
            [ "$(jq -r '.status' <<<"$run")" = "completed" ] || continue

            completed_epoch="$(
              date -d "$(jq -r '.updated_at' <<<"$run")" +%s
            )"
            now_epoch="$(date +%s)"
            [ "$((now_epoch - completed_epoch))" -ge 900 ] || continue

            gh issue edit "$issue_number" \
              --repo "$REPOSITORY" \
              --remove-label "factory:active" >/dev/null
            comment_once \
              "$issue_number" \
              "<!-- FACTORY_NO_OUTPUT_RUN: $run_id -->" \
              "Implementer run $(jq -r '.html_url' <<<"$run") completed with conclusion \`$(jq -r '.conclusion' <<<"$run")\` without a provenance-verified pull request; the issue is eligible for its next bounded attempt."
          done
