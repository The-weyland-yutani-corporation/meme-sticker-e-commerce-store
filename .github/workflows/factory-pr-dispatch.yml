name: Factory pull request dispatcher

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write
  statuses: write

concurrency:
  group: factory-pr-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch PR validation and reviews
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Reconcile pull requests and dispatch current heads
        shell: bash
        run: |
          set -euo pipefail

          function verify_implementer_provenance() {
            local pr_number="$1"
            local pr_url="$2"
            local pr_body="$3"
            local head_sha="$4"
            local run_id
            run_id="$(
              sed -nE \
                -e 's/.*gh-aw-agentic-workflow: Factory implementer, engine: [^,]+, model: [^,]+, id: ([0-9]+), workflow_id: factory-implement.*/\1/p' \
                -e 's#.*Generated by \[Factory implementer\]\([^)]*/actions/runs/([0-9]+)\).*#\1#p' \
                <<<"$pr_body" |
              tail -1
            )"
            [ -n "$run_id" ] || return 1

            local run
            run="$(gh api "repos/$REPOSITORY/actions/runs/$run_id")"
            [ "$(jq -r '.conclusion' <<<"$run")" = "success" ] &&
              [ "$(jq -r '.event' <<<"$run")" = "workflow_dispatch" ] &&
              [ "$(jq -r '.name' <<<"$run")" = "Factory implementer" ] &&
              [ "$(jq -r '.path' <<<"$run")" = ".github/workflows/factory-implement.lock.yml" ] &&
              [ "$(jq -r '.repository.full_name' <<<"$run")" = "$REPOSITORY" ] ||
              return 1

            local artifact_dir
            artifact_dir="$(mktemp -d)"
            if ! gh run download "$run_id" \
              --repo "$REPOSITORY" \
              --name "safe-outputs-items" \
              --dir "$artifact_dir" >/dev/null 2>&1; then
              rm -rf "$artifact_dir"
              return 1
            fi

            local artifact_matches=1
            if jq -e \
                --arg repo "$REPOSITORY" \
                --arg url "$pr_url" \
                --argjson number "$pr_number" \
                '
                  select(
                    .type == "create_pull_request" and
                    .repo == $repo and
                    .number == $number and
                    .url == $url
                  )
                ' "$artifact_dir/safe-output-items.jsonl" >/dev/null; then
              artifact_matches=0
            fi
            rm -rf "$artifact_dir"
            [ "$artifact_matches" -eq 0 ] || return 1

            local issue_number
            issue_number="$(
              gh issue list \
                --repo "$REPOSITORY" \
                --state open \
                --limit 100 \
                --json number,comments |
              jq -r --arg run "$run_id" '
                  [
                    .[] |
                    select(
                      any(
                        .comments[];
                        (
                          .author.login == "github-actions" or
                          .author.login == "github-actions[bot]"
                        ) and
                        (.body | contains("<!-- FACTORY_IMPLEMENT_RUN: \($run) -->"))
                      )
                    )
                  ] |
                  if length == 1 then .[0].number else empty end
                '
            )"
            [ -n "$issue_number" ] || return 1

            local marker
            marker="<!-- FACTORY_PROVENANCE issue=$issue_number run=$run_id -->"
            if ! gh api --paginate --slurp \
              "repos/$REPOSITORY/issues/$pr_number/comments" |
              jq -r --arg marker "$marker" '
                any(
                  .[][];
                  .user.login == "github-actions[bot]" and
                  (.body | contains($marker))
                )
              ' | grep -Fqx "true"; then
              if ! gh api \
                --method POST \
                "repos/$REPOSITORY/issues/$pr_number/comments" \
                -f body="Factory provenance verified for issue #$issue_number, implementer run $run_id, and current head \`$head_sha\`.

          $marker" >/dev/null; then
                return 2
              fi
            fi

            printf '%s\n' "$issue_number"
          }

          function dispatch_once() {
            local workflow="$1"
            local head_ref="$2"
            local head_sha="$3"
            local status_context="$4"
            shift 4

            local runs
            runs="$(
              gh run list \
                --repo "$REPOSITORY" \
                --workflow "$workflow" \
                --branch "$head_ref" \
                --limit 30 \
                --json databaseId,headSha,status,conclusion,url
            )"
            local current_run
            current_run="$(
              jq -c --arg sha "$head_sha" '
                (
                  [
                    .[] |
                    select(.headSha == $sha) |
                    select(
                      .status == "queued" or
                      .status == "in_progress" or
                      .status == "waiting" or
                      .status == "requested" or
                      .status == "pending" or
                      .conclusion == "success"
                    )
                  ][0] //
                  [.[] | select(.headSha == $sha)][0] //
                  {}
                )
              ' <<<"$runs"
            )"
            if [ -n "$status_context" ] &&
              [ "$(jq -r '.databaseId // empty' <<<"$current_run")" != "" ]; then
              local run_status conclusion state description
              run_status="$(jq -r '.status' <<<"$current_run")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$current_run")"
              state=pending
              description="$status_context is running for the exact pull request head."
              if [ "$run_status" = "completed" ]; then
                if [ "$conclusion" = "success" ]; then
                  state=success
                  description="$status_context passed for the exact pull request head."
                else
                  state=failure
                  description="$status_context failed for the exact pull request head."
                fi
              fi

              gh api \
                --method POST \
                "repos/$REPOSITORY/statuses/$head_sha" \
                -f state="$state" \
                -f context="$status_context" \
                -f description="$description" \
                -f target_url="$(jq -r '.url' <<<"$current_run")" >/dev/null
            fi

            local existing
            existing="$(
              jq --arg sha "$head_sha" '
                [
                  .[] |
                  select(.headSha == $sha) |
                  select(
                    .status == "queued" or
                    .status == "in_progress" or
                    .status == "waiting" or
                    .status == "requested" or
                    .status == "pending" or
                    .conclusion == "success"
                  )
                ] | length
              ' <<<"$runs"
            )"
            [ "$existing" -eq 0 ] || return 0

            gh workflow run "$workflow" \
              --repo "$REPOSITORY" \
              --ref "$head_ref" \
              "$@"
          }

          function reconcile_pr() {
            local pr_number="$1"
            local pr_api
            pr_api="$(gh api "repos/$REPOSITORY/pulls/$pr_number")"
            [ "$(jq -r '.state' <<<"$pr_api")" = "open" ] || return 0
            [ "$(jq -r '.draft' <<<"$pr_api")" = "false" ] || return 0
            [ "$(jq -r '.head.repo.full_name' <<<"$pr_api")" = "$REPOSITORY" ] ||
              return 0

            local author head_ref head_sha title body pr_url association
            author="$(jq -r '.user.login' <<<"$pr_api")"
            head_ref="$(jq -r '.head.ref' <<<"$pr_api")"
            head_sha="$(jq -r '.head.sha' <<<"$pr_api")"
            title="$(jq -r '.title' <<<"$pr_api")"
            body="$(jq -r '.body // ""' <<<"$pr_api")"
            pr_url="$(jq -r '.html_url' <<<"$pr_api")"
            association="$(jq -r '.author_association' <<<"$pr_api")"

            if [ "$author" = "github-actions[bot]" ]; then
              [[ "$head_ref" == factory/* ]] &&
                [[ "$title" == "[factory] "* ]] ||
                return 0
              local provenance_status=0
              verify_implementer_provenance \
                "$pr_number" "$pr_url" "$body" "$head_sha" >/dev/null ||
                provenance_status=$?
              case "$provenance_status" in
                0) ;;
                1) return 0 ;;
                *) return 1 ;;
              esac
            elif {
              [ "$author" = "dependabot" ] ||
              [ "$author" = "dependabot[bot]" ];
            }; then
              [[ "$head_ref" == dependabot/* ]] || return 0
            else
              case "$association" in
                OWNER|MEMBER|COLLABORATOR) ;;
                *) return 0 ;;
              esac
              [[ "$head_ref" == factory/* ]] &&
                [[ "$title" == "[factory] "* ]] ||
                return 0
            fi

            local labels
            labels="$(gh pr view "$pr_number" --repo "$REPOSITORY" --json labels)"
            jq -e '.labels[].name | select(. == "factory:managed")' \
              <<<"$labels" >/dev/null ||
              return 0

            if [ "$(jq -r '.mergeable_state' <<<"$pr_api")" = "behind" ]; then
              if ! gh api \
                --method PUT \
                "repos/$REPOSITORY/pulls/$pr_number/update-branch" \
                -f expected_head_sha="$head_sha" >/dev/null; then
                echo "::warning title=Factory branch update failed::Pull request #$pr_number could not be synchronized with the default branch."
                return 2
              fi
              gh pr edit "$pr_number" \
                --repo "$REPOSITORY" \
                --remove-label "factory:reviewed" \
                --remove-label "factory:security-reviewed" || true
              echo "::notice title=Factory branch updated::Pull request #$pr_number was synchronized with the default branch; exact-head gates will be dispatched on the next reconciliation."
              return 0
            fi

            local context
            context="$(
              jq -cn \
                --argjson pull_request "$pr_number" \
                --arg head_sha "$head_sha" \
                '{
                  item_type: "pull_request",
                  item_number: $pull_request,
                  head_sha: $head_sha,
                  instruction: "Review exactly this pull request and current head."
                }'
            )"

            local dispatch_failed=0
            dispatch_once "ci.yml" "$head_ref" "$head_sha" "Validate" ||
              dispatch_failed=1
            dispatch_once "codeql.yml" "$head_ref" "$head_sha" "Analyze" ||
              dispatch_failed=1
            dispatch_once \
              "factory-review.lock.yml" \
              "$head_ref" \
              "$head_sha" \
              "" \
              -f "aw_context=$context" ||
              dispatch_failed=1
            dispatch_once \
              "factory-security-review.lock.yml" \
              "$head_ref" \
              "$head_sha" \
              "" \
              -f "aw_context=$context" ||
              dispatch_failed=1
            [ "$dispatch_failed" -eq 0 ]
          }

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            reconcile_pr "${{ github.event.pull_request.number }}"
            exit 0
          fi

          gh pr list \
            --repo "$REPOSITORY" \
            --state open \
            --label "factory:managed" \
            --limit 50 \
            --json number \
            --jq '.[].number' |
          while read -r pr_number; do
            [ -n "$pr_number" ] || continue
            if ! reconcile_pr "$pr_number"; then
              echo "::warning title=PR reconciliation deferred::Pull request #$pr_number could not be fully dispatched and will be retried."
            fi
          done
