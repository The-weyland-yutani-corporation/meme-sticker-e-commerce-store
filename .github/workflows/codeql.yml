name: CodeQL

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 2"

permissions:
  actions: read
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          languages: javascript-typescript

      - name: Analyze
        uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          category: /language:javascript-typescript
          output: sarif-results
          upload: never

      - name: Enforce zero CodeQL findings
        shell: bash
        run: |
          set -euo pipefail
          total=0
          files=0
          while IFS= read -r file; do
            files=$((files + 1))
            count="$(jq '[.runs[].results[]?] | length' "$file")"
            total=$((total + count))
          done < <(find sarif-results -type f -name '*.sarif')
          if [ "$files" -eq 0 ]; then
            echo "::error::CodeQL did not produce a SARIF result."
            exit 1
          fi
          if [ "$total" -ne 0 ]; then
            echo "::error::CodeQL reported $total finding(s)."
            exit 1
          fi
