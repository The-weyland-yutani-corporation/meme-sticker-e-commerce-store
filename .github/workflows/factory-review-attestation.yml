name: Factory review attestation

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [synchronize]
  schedule:
    - cron: "4,14,24,34,44,54 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  invalidate:
    name: Invalidate stale review attestations
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove review labels from changed head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr edit "$PR_URL" \
            --remove-label "factory:reviewed" \
            --remove-label "factory:security-reviewed" || true

  attest:
    name: Reconcile review attestations
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify review runs match the current pull request head
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          function verify_run() {
            local run_id="$1"
            local expected_sha="$2"
            local expected_workflow="$3"

            if [ -z "$run_id" ]; then
              return 1
            fi

            local run
            run="$(
              gh run view "$run_id" \
                --repo "$REPOSITORY" \
                --json conclusion,headSha,workflowName
            )"

            [ "$(jq -r '.conclusion' <<<"$run")" = "success" ] &&
              [ "$(jq -r '.headSha' <<<"$run")" = "$expected_sha" ] &&
              [ "$(jq -r '.workflowName' <<<"$run")" = "$expected_workflow" ]
          }

          gh pr list \
            --repo "$REPOSITORY" \
            --state open \
            --label "factory:managed" \
            --limit 50 \
            --json number,headRefOid \
            --jq '.[] | [.number, .headRefOid] | @tsv' |
          while IFS=$'\t' read -r pr_number head_sha; do
            pr="$(
              gh pr view "$pr_number" \
                --repo "$REPOSITORY" \
                --json author,baseRefName,headRefName,isDraft,labels,title
            )"
            default_branch="$(
              gh repo view "$REPOSITORY" --json defaultBranchRef --jq '.defaultBranchRef.name'
            )"
            author="$(jq -r '.author.login' <<<"$pr")"
            head_ref="$(jq -r '.headRefName' <<<"$pr")"
            title="$(jq -r '.title' <<<"$pr")"

            if [ "$(jq -r '.isDraft' <<<"$pr")" = "true" ] ||
              [ "$(jq -r '.baseRefName' <<<"$pr")" != "$default_branch" ]; then
              continue
            fi

            if ! {
              { [[ "$head_ref" == factory/* ]] && [[ "$title" == "[factory] "* ]]; } ||
              {
                { [ "$author" = "dependabot" ] || [ "$author" = "dependabot[bot]" ]; } &&
                [[ "$head_ref" == dependabot/* ]]
              }
            }; then
              continue
            fi

            changed_files="$(gh pr diff "$pr_number" --repo "$REPOSITORY" --name-only)"
            if grep -Eq '^(\.factory/|\.github/)' <<<"$changed_files" &&
              ! jq -e '.labels[].name | select(. == "factory:governance")' \
                <<<"$pr" >/dev/null; then
              continue
            fi

            comments="$(
              gh api \
                --paginate \
                --slurp \
                "repos/$REPOSITORY/issues/$pr_number/comments"
            )"

            correctness_run="$(
              jq -r '
                [
                  .[][] |
                  select(.user.login == "github-actions[bot]") |
                  select(.body | contains("FACTORY_CORRECTNESS_REVIEW")) |
                  .body
                ] |
                last // "" |
                select(contains("VERDICT: PASS")) |
                (try capture(
                  "gh-aw-agentic-workflow: [^,]+, engine: [^,]+, model: [^,]+, id: (?<id>[0-9]+),"
                ).id catch empty)
              ' <<<"$comments"
            )"
            security_run="$(
              jq -r '
                [
                  .[][] |
                  select(.user.login == "github-actions[bot]") |
                  select(.body | contains("FACTORY_SECURITY_REVIEW")) |
                  .body
                ] |
                last // "" |
                select(contains("VERDICT: PASS")) |
                (try capture(
                  "gh-aw-agentic-workflow: [^,]+, engine: [^,]+, model: [^,]+, id: (?<id>[0-9]+),"
                ).id catch empty)
              ' <<<"$comments"
            )"

            correctness_verified=false
            security_verified=false

            if verify_run \
              "$correctness_run" \
              "$head_sha" \
              "Independent factory reviewer"; then
              correctness_verified=true
              gh pr edit "$pr_number" \
                --repo "$REPOSITORY" \
                --add-label "factory:reviewed"
            fi

            if verify_run \
              "$security_run" \
              "$head_sha" \
              "Independent factory security reviewer"; then
              security_verified=true
              gh pr edit "$pr_number" \
                --repo "$REPOSITORY" \
                --add-label "factory:security-reviewed"
            fi

            if [ "$correctness_verified" = "true" ] &&
              [ "$security_verified" = "true" ]; then
              gh pr merge "$pr_number" \
                --repo "$REPOSITORY" \
                --squash \
                --match-head-commit "$head_sha" || true
            fi
          done
