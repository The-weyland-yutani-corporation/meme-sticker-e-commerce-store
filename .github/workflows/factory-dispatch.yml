name: Factory queue dispatcher

on:
  issues:
    types: [opened, labeled, reopened]
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: factory-queue-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch ready work
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify GitHub App configuration
        env:
          APP_ID: ${{ vars.DARK_FACTORY_MAGE_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.DARK_FACTORY_MAGE_APP_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "$APP_ID" ] && [ -n "$APP_PRIVATE_KEY" ]; then
            exit 0
          fi

          title="[factory dispatch] Missing GitHub App configuration"
          existing="$(
            gh issue list \
              --repo "$REPOSITORY" \
              --state open \
              --search "$title in:title" \
              --limit 1 \
              --json number \
              --jq '.[0].number // empty'
          )"
          if [ -z "$existing" ]; then
            gh issue create \
              --repo "$REPOSITORY" \
              --title "$title" \
              --body "Set DARK_FACTORY_MAGE_APP_ID and expose DARK_FACTORY_MAGE_APP_PRIVATE_KEY to this repository before autonomous dispatch can run." \
              --label "factory:incident"
          fi
          exit 1

      - name: Mint repository-scoped dispatcher token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.DARK_FACTORY_MAGE_APP_ID }}
          private-key: ${{ secrets.DARK_FACTORY_MAGE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: write

      - name: Start implementer only when work is ready
        env:
          DISPATCH_ACTOR: ${{ steps.app-token.outputs.app-slug }}[bot]
          DISPATCH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          function upsert_incident() {
            local title="$1"
            local body="$2"
            local existing
            existing="$(
              gh issue list \
                --repo "$REPOSITORY" \
                --state open \
                --search "$title in:title" \
                --limit 1 \
                --json number \
                --jq '.[0].number // empty'
            )"
            if [ -n "$existing" ]; then
              echo "Incident #$existing already records: $title"
            else
              gh issue create \
                --repo "$REPOSITORY" \
                --title "$title" \
                --body "$body" \
                --label "factory:incident"
            fi
          }

          active_run_count="$(
            gh run list \
              --repo "$REPOSITORY" \
              --workflow "factory-implement.lock.yml" \
              --limit 20 \
              --json status \
              --jq '[
                .[] |
                select(
                  .status == "queued" or
                  .status == "in_progress" or
                  .status == "waiting" or
                  .status == "requested" or
                  .status == "pending"
                )
              ] | length'
          )"
          if [ "$active_run_count" -gt 0 ]; then
            echo "Factory implementer is already queued or running."
            exit 0
          fi

          policy="$(
            gh api "repos/$REPOSITORY/contents/.factory/policy.yml" \
              --jq '.content' |
            base64 --decode
          )"
          wip_limit="$(
            awk '
              /^queue:/ { in_queue=1; next }
              in_queue && /^[^ ]/ { in_queue=0 }
              in_queue && /work_in_progress_limit:/ { print $2; exit }
            ' <<<"$policy"
          )"
          max_attempts="$(
            awk '
              /^queue:/ { in_queue=1; next }
              in_queue && /^[^ ]/ { in_queue=0 }
              in_queue && /max_attempts_per_issue:/ { print $2; exit }
            ' <<<"$policy"
          )"
          : "${wip_limit:?Missing queue.work_in_progress_limit}"
          : "${max_attempts:?Missing queue.max_attempts_per_issue}"

          active_pr_count="$(
            gh pr list \
              --repo "$REPOSITORY" \
              --state open \
              --search "label:factory:managed -author:app/dependabot" \
              --limit 100 \
              --json number \
              --jq 'length'
          )"
          if [ "$active_pr_count" -ge "$wip_limit" ]; then
            echo "Factory WIP limit reached: $active_pr_count/$wip_limit."
            exit 0
          fi

          function select_issue() {
            local label="$1"
            gh issue list \
              --repo "$REPOSITORY" \
              --state open \
              --label "$label" \
              --limit 100 \
              --json number,createdAt,labels \
              --jq '
                [
                  .[] |
                  select(
                    ([.labels[].name] | index("factory:active") | not) and
                    ([.labels[].name] | index("factory:blocked") | not) and
                    ([.labels[].name] | index("risk:prohibited") | not)
                  )
                ] |
                sort_by(.createdAt) |
                .[0].number // empty
              '
          }

          issue_number="$(select_issue "factory:repair")"
          if [ -z "$issue_number" ]; then
            issue_number="$(select_issue "factory:ready")"
          fi
          if [ -z "$issue_number" ]; then
            echo "No ready or repair work."
            exit 0
          fi

          attempt_count="$(
            gh api \
              --paginate \
              "repos/$REPOSITORY/issues/$issue_number/comments" \
              --jq '[
                .[] |
                select(
                  .user.login == "github-actions[bot]" and
                  .performed_via_github_app.slug == "github-actions" and
                  .created_at == .updated_at and
                  (.body | contains("<!-- FACTORY_IMPLEMENT_ATTEMPT -->"))
                )
              ] | length'
          )"
          if [ "$attempt_count" -ge "$max_attempts" ]; then
            gh issue edit "$issue_number" \
              --repo "$REPOSITORY" \
              --remove-label "factory:ready" \
              --remove-label "factory:repair" \
              --remove-label "factory:active" \
              --add-label "factory:blocked"
            upsert_incident \
              "[factory dispatch] Issue #$issue_number exhausted implementation attempts" \
              "Issue #$issue_number reached the policy ceiling of $max_attempts attempts and was moved to factory:blocked."
            exit 1
          fi

          next_attempt="$((attempt_count + 1))"
          aw_context="$(
            jq -cn \
              --argjson item_number "$issue_number" \
              '{item_type:"issue", item_number:$item_number}'
          )"

          gh issue edit "$issue_number" \
            --repo "$REPOSITORY" \
            --add-label "factory:active"

          attempt_comment_id="$(
            gh api \
              --method POST \
              "repos/$REPOSITORY/issues/$issue_number/comments" \
              -f body="Implementation attempt $next_attempt of $max_attempts dispatched as @$DISPATCH_ACTOR.

          <!-- FACTORY_IMPLEMENT_ATTEMPT -->" \
              --jq '.id'
          )"

          if ! GH_TOKEN="$DISPATCH_TOKEN" gh workflow run \
            "factory-implement.lock.yml" \
            --repo "$REPOSITORY" \
            --field "aw_context=$aw_context"; then
            gh issue edit "$issue_number" \
              --repo "$REPOSITORY" \
              --remove-label "factory:active"
            gh api \
              --method DELETE \
              "repos/$REPOSITORY/issues/comments/$attempt_comment_id"
            exit 1
          fi
