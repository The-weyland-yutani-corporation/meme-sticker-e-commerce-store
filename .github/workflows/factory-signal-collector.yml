name: Factory signal collector

on:
  workflow_dispatch:
  schedule:
    - cron: "11,41 * * * *"

permissions:
  actions: read
  checks: read
  contents: read
  id-token: write
  issues: write
  pull-requests: read
  security-events: read

concurrency:
  group: factory-signal-collector
  cancel-in-progress: false

jobs:
  collect:
    name: Collect deterministic signals
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      APP_URL: ${{ vars.APP_URL }}
      AZURE_APP_NAME: ${{ vars.AZURE_APP_NAME }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_MONTHLY_BUDGET_USD: ${{ vars.AZURE_MONTHLY_BUDGET_USD }}
      AZURE_POSTGRES_NAME: ${{ vars.AZURE_POSTGRES_NAME }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      SIGNAL_COOLDOWN_HOURS: "6"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sign in to Azure with OIDC
        if: env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != '' && env.AZURE_SUBSCRIPTION_ID != ''
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Collect repository and production signals
        shell: bash
        run: bash .github/workflows/scripts/collect-factory-signals.sh
