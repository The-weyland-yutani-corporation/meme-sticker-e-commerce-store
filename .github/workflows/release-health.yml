name: Autonomous Azure release controller

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  deployments: write
  id-token: write
  issues: write

concurrency:
  group: autonomous-azure-release-controller
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  REPOSITORY: ${{ github.repository }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  plan:
    name: Reconcile main and production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      previous_blob: ${{ steps.reconcile.outputs.previous_blob }}
      previous_sha: ${{ steps.reconcile.outputs.previous_sha }}
      release_required: ${{ steps.reconcile.outputs.release_required }}
      target_sha: ${{ steps.reconcile.outputs.target_sha }}
    steps:
      - name: Reconcile latest main SHA
        id: reconcile
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          default_branch="${DEFAULT_BRANCH:-main}"
          target_sha="$(gh api "repos/${REPOSITORY}/commits/${default_branch}" --jq '.sha')"
          deployments="$(
            gh api --paginate --slurp \
              "repos/${REPOSITORY}/deployments?environment=production&per_page=100" |
              jq 'add'
          )"
          previous='null'
          target_is_live=false

          while IFS= read -r deployment; do
            [ "$(jq -r '.description // empty' <<<"$deployment")" = \
              "Autonomous Azure production release" ] || continue
            [ -n "$(jq -r '.payload.package_blob? // empty' <<<"$deployment")" ] ||
              continue
            deployment_id="$(jq -r '.id' <<<"$deployment")"
            status="$(
              gh api \
                "repos/${REPOSITORY}/deployments/${deployment_id}/statuses?per_page=1"
            )"
            [ "$(jq -r '.[0].state // empty' <<<"$status")" = "success" ] || continue
            deployment_sha="$(jq -r '.sha' <<<"$deployment")"
            if [ "$deployment_sha" = "$target_sha" ]; then
              target_is_live=true
              continue
            fi
            if [ "$previous" = "null" ]; then
              previous="$deployment"
            fi
          done < <(jq -c '.[]' <<<"$deployments")

          {
            echo "target_sha=$target_sha"
            echo "release_required=$([ "$target_is_live" = true ] && echo false || echo true)"
            echo "previous_sha=$(jq -r '.sha // empty' <<<"$previous")"
            echo "previous_blob=$(jq -r '.payload.package_blob // empty' <<<"$previous")"
          } >>"$GITHUB_OUTPUT"

  release:
    name: Deploy production
    needs: plan
    if: needs.plan.outputs.release_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      APP_URL: ${{ vars.APP_URL }}
      AZURE_APP_NAME: ${{ vars.AZURE_APP_NAME }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_KEY_VAULT_NAME: ${{ vars.AZURE_KEY_VAULT_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_NAME_PREFIX: ${{ vars.AZURE_NAME_PREFIX }}
      AZURE_POSTGRES_NAME: ${{ vars.AZURE_POSTGRES_NAME }}
      AZURE_PRINCIPAL_OBJECT_ID: ${{ vars.AZURE_PRINCIPAL_OBJECT_ID }}
      AZURE_RELEASE_CONTAINER: ${{ vars.AZURE_RELEASE_CONTAINER }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      EXPECTED_RELEASE_SHA: ${{ needs.plan.outputs.target_sha }}
      RELEASE_SHA: ${{ needs.plan.outputs.target_sha }}
      TARGET_SHA: ${{ needs.plan.outputs.target_sha }}
    steps:
      - name: Check out exact target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.target_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Validate Azure environment identifiers
        shell: bash
        run: |
          set -euo pipefail
          required=(
            APP_URL
            AZURE_APP_NAME
            AZURE_CLIENT_ID
            AZURE_KEY_VAULT_NAME
            AZURE_LOCATION
            AZURE_NAME_PREFIX
            AZURE_POSTGRES_NAME
            AZURE_PRINCIPAL_OBJECT_ID
            AZURE_RELEASE_CONTAINER
            AZURE_RESOURCE_GROUP
            AZURE_STORAGE_ACCOUNT
            AZURE_SUBSCRIPTION_ID
            AZURE_TENANT_ID
          )
          missing=()
          for variable_name in "${required[@]}"; do
            if [ -z "${!variable_name:-}" ]; then
              missing+=("$variable_name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Azure production bootstrap is incomplete. Missing environment variables: %s\n' \
              "${missing[*]}" >&2
            exit 1
          fi

      - name: Sign in to Azure with OIDC
        uses: azure/login@eec3c95657c1536435858eda1f3ff5437fee8474 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install dependencies
        run: npm ci

      - name: Read production secrets
        shell: bash
        run: |
          set -euo pipefail
          database_url="$(
            az keyvault secret show \
              --vault-name "$AZURE_KEY_VAULT_NAME" \
              --name database-url \
              --query value \
              --output tsv
          )"
          postgres_password="$(
            az keyvault secret show \
              --vault-name "$AZURE_KEY_VAULT_NAME" \
              --name postgres-admin-password \
              --query value \
              --output tsv
          )"
          probe_token="$(
            az keyvault secret show \
              --vault-name "$AZURE_KEY_VAULT_NAME" \
              --name synthetic-probe-token \
              --query value \
              --output tsv
          )"
          echo "::add-mask::$database_url"
          echo "::add-mask::$postgres_password"
          echo "::add-mask::$probe_token"
          {
            echo "DATABASE_URL=$database_url"
            echo "POSTGRES_ADMIN_PASSWORD=$postgres_password"
            echo "SYNTHETIC_PROBE_TOKEN=$probe_token"
          } >>"$GITHUB_ENV"

      - name: Validate production configuration
        run: scripts/release/validate-config.sh production

      - name: Validate and preview infrastructure
        shell: bash
        run: |
          set -euo pipefail
          infrastructure_release_sha="${{ needs.plan.outputs.previous_sha }}"
          if [ -z "$infrastructure_release_sha" ]; then
            infrastructure_release_sha=bootstrap
          fi
          scripts/azure/validate-bicep.sh
          az deployment group what-if \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam \
            --parameters \
              deploymentPrincipalObjectId="$AZURE_PRINCIPAL_OBJECT_ID" \
              postgresAdminPassword="$POSTGRES_ADMIN_PASSWORD" \
              syntheticProbeToken="$SYNTHETIC_PROBE_TOKEN" \
              releaseSha="$infrastructure_release_sha" \
            --no-pretty-print >/dev/null
          az deployment group create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam \
            --parameters \
              deploymentPrincipalObjectId="$AZURE_PRINCIPAL_OBJECT_ID" \
              postgresAdminPassword="$POSTGRES_ADMIN_PASSWORD" \
              syntheticProbeToken="$SYNTHETIC_PROBE_TOKEN" \
              releaseSha="$infrastructure_release_sha" \
            --output none
          scripts/azure/configure-postgres-firewall.sh

      - name: Build immutable application package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          archive="$(scripts/release/package-app.sh | tail -n 1)"
          blob_name="${TARGET_SHA}.zip"
          package_exists="$(
            az storage blob exists \
              --account-name "$AZURE_STORAGE_ACCOUNT" \
              --auth-mode login \
              --container-name "$AZURE_RELEASE_CONTAINER" \
              --name "$blob_name" \
              --query exists \
              --output tsv
          )"
          if [ "$package_exists" != true ]; then
            az storage blob upload \
              --account-name "$AZURE_STORAGE_ACCOUNT" \
              --auth-mode login \
              --container-name "$AZURE_RELEASE_CONTAINER" \
              --name "$blob_name" \
              --file "$archive" \
              --overwrite false \
              --only-show-errors
          fi
          echo "archive=$archive" >>"$GITHUB_OUTPUT"
          echo "blob_name=$blob_name" >>"$GITHUB_OUTPUT"

      - name: Create GitHub production deployment
        id: deployment
        shell: bash
        env:
          PACKAGE_BLOB: ${{ steps.package.outputs.blob_name }}
          PREVIOUS_BLOB: ${{ needs.plan.outputs.previous_blob }}
          PREVIOUS_SHA: ${{ needs.plan.outputs.previous_sha }}
        run: |
          set -euo pipefail
          request="$(
            jq -cn \
              --arg ref "$TARGET_SHA" \
              --arg package_blob "$PACKAGE_BLOB" \
              --arg previous_blob "$PREVIOUS_BLOB" \
              --arg previous_sha "$PREVIOUS_SHA" \
              --arg run_url "$RUN_URL" \
              '{
                ref:$ref,
                environment:"production",
                description:"Autonomous Azure production release",
                payload:{
                  package_blob:$package_blob,
                  previous_blob:$previous_blob,
                  previous_sha:$previous_sha,
                  run_url:$run_url
                },
                auto_merge:false,
                transient_environment:false,
                production_environment:true,
                required_contexts:[]
              }'
          )"
          deployment_id="$(
            gh api --method POST "repos/${REPOSITORY}/deployments" \
              --input - \
              <<<"$request" \
              --jq '.id'
          )"
          echo "deployment_id=$deployment_id" >>"$GITHUB_OUTPUT"
          gh api --method POST \
            "repos/${REPOSITORY}/deployments/${deployment_id}/statuses" \
            -f state=in_progress \
            -f log_url="$RUN_URL" \
            -f environment_url="$APP_URL" \
            -f description="Azure migration and deployment started" >/dev/null

      - name: Open temporary migration firewall rule
        id: firewall
        shell: bash
        run: |
          set -euo pipefail
          runner_ip="$(curl --fail --silent --show-error https://api.ipify.org)"
          rule_name="github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          az postgres flexible-server firewall-rule create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_POSTGRES_NAME" \
            --rule-name "$rule_name" \
            --start-ip-address "$runner_ip" \
            --end-ip-address "$runner_ip" \
            --output none
          echo "rule_name=$rule_name" >>"$GITHUB_OUTPUT"

      - name: Enforce additive migrations
        run: scripts/release/check-migrations.sh "${{ needs.plan.outputs.previous_sha }}" "$TARGET_SHA"

      - name: Apply production migrations
        run: npm run db:migrate

      - name: Close temporary migration firewall rule
        if: always() && steps.firewall.outputs.rule_name != ''
        shell: bash
        run: |
          az postgres flexible-server firewall-rule delete \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_POSTGRES_NAME" \
            --rule-name "${{ steps.firewall.outputs.rule_name }}" \
            --yes \
            --output none

      - name: Deploy exact package to App Service
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          echo "attempted=true" >>"$GITHUB_OUTPUT"
          az webapp config appsettings set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_APP_NAME" \
            --settings "RELEASE_SHA=$TARGET_SHA" \
            --output none
          az webapp deploy \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_APP_NAME" \
            --src-path "${{ steps.package.outputs.archive }}" \
            --type zip \
            --clean true \
            --restart true \
            --async false \
            --output none

      - name: Run production gates
        run: scripts/release/probe-release.sh "$APP_URL"

      - name: Roll back failed application deployment
        id: rollback
        if: failure() && steps.deploy.outputs.attempted == 'true'
        shell: bash
        env:
          PREVIOUS_BLOB: ${{ needs.plan.outputs.previous_blob }}
          PREVIOUS_SHA: ${{ needs.plan.outputs.previous_sha }}
        run: |
          set -euo pipefail
          if [ -z "$PREVIOUS_BLOB" ] || [ -z "$PREVIOUS_SHA" ]; then
            echo "::error::No previous successful package is available for rollback."
            exit 1
          fi
          az storage blob download \
            --account-name "$AZURE_STORAGE_ACCOUNT" \
            --auth-mode login \
            --container-name "$AZURE_RELEASE_CONTAINER" \
            --name "$PREVIOUS_BLOB" \
            --file previous.zip \
            --only-show-errors
          az webapp config appsettings set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_APP_NAME" \
            --settings "RELEASE_SHA=$PREVIOUS_SHA" \
            --output none
          az webapp deploy \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_APP_NAME" \
            --src-path previous.zip \
            --type zip \
            --clean true \
            --restart true \
            --async false \
            --output none
          EXPECTED_RELEASE_SHA="$PREVIOUS_SHA" scripts/release/probe-release.sh "$APP_URL"
          echo "verified=true" >>"$GITHUB_OUTPUT"

      - name: Record production result
        if: always() && steps.deployment.outputs.deployment_id != ''
        shell: bash
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
          JOB_STATUS: ${{ job.status }}
          ROLLBACK_VERIFIED: ${{ steps.rollback.outputs.verified }}
        run: |
          set -euo pipefail
          state=failure
          description="Azure production release failed"
          if [ "$JOB_STATUS" = success ]; then
            state=success
            description="Azure production deployment and probes passed"
          elif [ "$ROLLBACK_VERIFIED" = true ]; then
            description="Azure production release failed; previous package restored"
          fi
          gh api --method POST \
            "repos/${REPOSITORY}/deployments/${DEPLOYMENT_ID}/statuses" \
            -f state="$state" \
            -f log_url="$RUN_URL" \
            -f environment_url="$APP_URL" \
            -f description="$description" >/dev/null

      - name: Write release evidence
        if: always()
        shell: bash
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
          JOB_STATUS: ${{ job.status }}
          PACKAGE_BLOB: ${{ steps.package.outputs.blob_name }}
          PREVIOUS_BLOB: ${{ needs.plan.outputs.previous_blob }}
          PREVIOUS_SHA: ${{ needs.plan.outputs.previous_sha }}
          ROLLBACK_VERIFIED: ${{ steps.rollback.outputs.verified }}
        run: |
          jq -n \
            --arg app_url "$APP_URL" \
            --arg deployment_id "$DEPLOYMENT_ID" \
            --arg outcome "$JOB_STATUS" \
            --arg package_blob "$PACKAGE_BLOB" \
            --arg previous_blob "$PREVIOUS_BLOB" \
            --arg previous_sha "$PREVIOUS_SHA" \
            --arg rollback_verified "$ROLLBACK_VERIFIED" \
            --arg run_url "$RUN_URL" \
            --arg target_sha "$TARGET_SHA" \
            --arg timestamp "$(date -u +%FT%TZ)" \
            '{
              app_url:$app_url,
              deployment_id:$deployment_id,
              outcome:$outcome,
              package_blob:$package_blob,
              previous_blob:$previous_blob,
              previous_sha:$previous_sha,
              rollback_verified:($rollback_verified == "true"),
              run_url:$run_url,
              target_sha:$target_sha,
              timestamp:$timestamp
            }' >production-release-evidence.json

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-release-evidence-${{ needs.plan.outputs.target_sha }}
          path: production-release-evidence.json
          retention-days: 90

      - name: Report release failure
        if: failure()
        env:
          RELEASE_PHASE: azure-production
        run: scripts/release/incident.sh report "Azure migration, deployment, production gates, or rollback failed."

      - name: Resolve recovered release incident
        if: success()
        env:
          RELEASE_PHASE: azure-production
        run: scripts/release/incident.sh resolve

  monitor:
    name: Monitor current production
    needs: plan
    if: needs.plan.outputs.release_required == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      APP_URL: ${{ vars.APP_URL }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_KEY_VAULT_NAME: ${{ vars.AZURE_KEY_VAULT_NAME }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      EXPECTED_RELEASE_SHA: ${{ needs.plan.outputs.target_sha }}
      TARGET_SHA: ${{ needs.plan.outputs.target_sha }}
    steps:
      - name: Check out deployed SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.target_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Sign in to Azure with OIDC
        uses: azure/login@eec3c95657c1536435858eda1f3ff5437fee8474 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install dependencies
        run: npm ci

      - name: Read probe configuration
        shell: bash
        run: |
          set -euo pipefail
          database_url="$(az keyvault secret show --vault-name "$AZURE_KEY_VAULT_NAME" --name database-url --query value --output tsv)"
          probe_token="$(az keyvault secret show --vault-name "$AZURE_KEY_VAULT_NAME" --name synthetic-probe-token --query value --output tsv)"
          echo "::add-mask::$database_url"
          echo "::add-mask::$probe_token"
          {
            echo "DATABASE_URL=$database_url"
            echo "SYNTHETIC_PROBE_TOKEN=$probe_token"
          } >>"$GITHUB_ENV"

      - name: Run scheduled production probes
        run: scripts/release/probe-release.sh "$APP_URL"

      - name: Report production health failure
        if: failure()
        env:
          RELEASE_PHASE: azure-production-monitor
        run: scripts/release/incident.sh report "Scheduled Azure production health or synthetic-order probes failed."

      - name: Resolve recovered release incident
        if: success()
        env:
          RELEASE_PHASE: azure-production-monitor
        run: scripts/release/incident.sh resolve
