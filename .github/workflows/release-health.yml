name: Autonomous release controller

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  deployments: write
  issues: write

concurrency:
  group: autonomous-release-controller
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  REPOSITORY: ${{ github.repository }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  plan:
    name: Reconcile main and deployments
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      previous_production_sha: ${{ steps.reconcile.outputs.previous_production_sha }}
      previous_production_url: ${{ steps.reconcile.outputs.previous_production_url }}
      release_required: ${{ steps.reconcile.outputs.release_required }}
      target_sha: ${{ steps.reconcile.outputs.target_sha }}
    steps:
      - name: Check out controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reconcile latest main SHA
        id: reconcile
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          default_branch="${DEFAULT_BRANCH:-main}"
          target_sha="$(
            gh api "repos/${REPOSITORY}/commits/${default_branch}" --jq '.sha'
          )"
          previous_sha=""
          previous_url=""
          target_is_live="false"

          while IFS=$'\t' read -r deployment_id deployment_sha; do
            [ -n "$deployment_id" ] || continue
            status="$(
              gh api \
                "repos/${REPOSITORY}/deployments/${deployment_id}/statuses?per_page=1"
            )"
            state="$(jq -r '.[0].state // empty' <<<"$status")"
            [ "$state" = "success" ] || continue

            environment_url="$(
              jq -r '.[0].environment_url // .[0].target_url // empty' \
                <<<"$status"
            )"
            if [ "$deployment_sha" = "$target_sha" ]; then
              target_is_live="true"
              continue
            fi
            if [ -z "$previous_sha" ]; then
              previous_sha="$deployment_sha"
              previous_url="$environment_url"
            fi
          done < <(
            gh api --paginate \
              "repos/${REPOSITORY}/deployments?environment=production&per_page=100" \
              --jq '.[] | [.id, .sha] | @tsv'
          )

          {
            echo "target_sha=$target_sha"
            echo "previous_production_sha=$previous_sha"
            echo "previous_production_url=$previous_url"
            if [ "$target_is_live" = "true" ]; then
              echo "release_required=false"
            else
              echo "release_required=true"
            fi
          } >>"$GITHUB_OUTPUT"

      - name: Report reconciliation failure
        if: failure()
        shell: bash
        env:
          RELEASE_PHASE: reconcile
          TARGET_SHA: ${{ steps.reconcile.outputs.target_sha }}
        run: scripts/release/incident.sh report "Unable to reconcile main against GitHub Deployments."

  staging:
    name: Migrate and deploy staging
    needs: plan
    if: needs.plan.outputs.release_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    outputs:
      deployment_id: ${{ steps.github_deployment.outputs.deployment_id }}
      deployment_url: ${{ steps.deploy.outputs.deployment_url }}
    env:
      APP_URL: ${{ vars.APP_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      TARGET_SHA: ${{ needs.plan.outputs.target_sha }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check out target SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.target_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate staging bootstrap
        run: scripts/release/validate-config.sh staging

      - name: Pull and validate Vercel staging configuration
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@59.26.0 pull \
            --yes \
            --environment=staging \
            --token="$VERCEL_TOKEN"
          scripts/release/validate-vercel-env.sh staging

      - name: Create staging deployment record
        id: github_deployment
        shell: bash
        run: |
          set -euo pipefail
          deployment_id="$(
            gh api --method POST "repos/${REPOSITORY}/deployments" \
              -f ref="$TARGET_SHA" \
              -f environment="staging" \
              -f description="Autonomous staging release" \
              -f payload="{\"run_url\":\"${RUN_URL}\"}" \
              -F auto_merge=false \
              -F transient_environment=true \
              -F production_environment=false \
              --jq '.id'
          )"
          echo "deployment_id=$deployment_id" >>"$GITHUB_OUTPUT"
          gh api --method POST \
            "repos/${REPOSITORY}/deployments/${deployment_id}/statuses" \
            -f state="in_progress" \
            -f log_url="$RUN_URL" \
            -f description="Migration and staging deployment started" >/dev/null

      - name: Enforce additive migrations
        run: |
          scripts/release/check-migrations.sh \
            "${{ needs.plan.outputs.previous_production_sha }}" \
            "$TARGET_SHA"

      - name: Apply staging migrations
        run: npm run db:migrate

      - name: Deploy staging
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="$(
            npx --yes vercel@59.26.0 deploy \
              --yes \
              --target=staging \
              --meta="releaseSha=${TARGET_SHA}" \
              --token="$VERCEL_TOKEN" |
              tail -n 1
          )"
          if [[ "$deployment_url" != https://* ]]; then
            echo "Vercel did not return a staging deployment URL." >&2
            exit 1
          fi
          echo "deployment_url=$deployment_url" >>"$GITHUB_OUTPUT"
          vercel_deployment_id="$(
            npx --yes vercel@59.26.0 inspect "$deployment_url" \
              --wait \
              --timeout=5m \
              --json \
              --token="$VERCEL_TOKEN" |
              jq -er '.id'
          )"
          echo "vercel_deployment_id=$vercel_deployment_id" >>"$GITHUB_OUTPUT"

      - name: Run safe staging probes
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail
          scripts/release/probe-release.sh "$DEPLOYMENT_URL"
          if [ "${APP_URL%/}" != "${DEPLOYMENT_URL%/}" ]; then
            scripts/release/probe-release.sh "$APP_URL"
          fi

      - name: Record staging deployment result
        if: always() && steps.github_deployment.outputs.deployment_id != ''
        shell: bash
        env:
          DEPLOYMENT_ID: ${{ steps.github_deployment.outputs.deployment_id }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state="failure"
          description="Staging release failed"
          if [ "$JOB_STATUS" = "success" ]; then
            state="success"
            description="Staging migration and probes passed"
          fi
          arguments=(
            --method POST
            "repos/${REPOSITORY}/deployments/${DEPLOYMENT_ID}/statuses"
            -f "state=${state}"
            -f "log_url=${RUN_URL}"
            -f "description=${description}"
          )
          if [ -n "$DEPLOYMENT_URL" ]; then
            arguments+=(-f "environment_url=${DEPLOYMENT_URL}")
          fi
          gh api "${arguments[@]}" >/dev/null

      - name: Write staging evidence
        if: always()
        shell: bash
        env:
          DEPLOYMENT_ID: ${{ steps.github_deployment.outputs.deployment_id }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
          JOB_STATUS: ${{ job.status }}
          PREVIOUS_SHA: ${{ needs.plan.outputs.previous_production_sha }}
          VERCEL_DEPLOYMENT_ID: ${{ steps.deploy.outputs.vercel_deployment_id }}
        run: |
          jq -n \
            --arg deployment_id "$DEPLOYMENT_ID" \
            --arg deployment_url "$DEPLOYMENT_URL" \
            --arg vercel_deployment_id "$VERCEL_DEPLOYMENT_ID" \
            --arg environment "staging" \
            --arg outcome "$JOB_STATUS" \
            --arg previous_sha "$PREVIOUS_SHA" \
            --arg run_url "$RUN_URL" \
            --arg target_sha "$TARGET_SHA" \
            --arg timestamp "$(date -u +%FT%TZ)" \
            '{
              deployment_id: $deployment_id,
              deployment_url: $deployment_url,
              vercel_deployment_id: $vercel_deployment_id,
              environment: $environment,
              outcome: $outcome,
              previous_production_sha: $previous_sha,
              run_url: $run_url,
              target_sha: $target_sha,
              timestamp: $timestamp
            }' > staging-release-evidence.json

      - name: Upload staging evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-release-evidence-${{ needs.plan.outputs.target_sha }}
          path: staging-release-evidence.json
          retention-days: 30

      - name: Report staging failure
        if: failure()
        env:
          RELEASE_PHASE: staging
        run: scripts/release/incident.sh report "Staging configuration, migration, deployment, or safe probes failed."

  production:
    name: Promote to production
    needs: [plan, staging]
    if: needs.plan.outputs.release_required == 'true' && needs.staging.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      APP_URL: ${{ vars.APP_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      TARGET_SHA: ${{ needs.plan.outputs.target_sha }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check out target SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.target_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate production bootstrap
        run: scripts/release/validate-config.sh production

      - name: Pull and validate Vercel production configuration
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@59.26.0 pull \
            --yes \
            --environment=production \
            --token="$VERCEL_TOKEN"
          scripts/release/validate-vercel-env.sh production

      - name: Create production deployment record
        id: github_deployment
        shell: bash
        run: |
          set -euo pipefail
          deployment_id="$(
            gh api --method POST "repos/${REPOSITORY}/deployments" \
              -f ref="$TARGET_SHA" \
              -f environment="production" \
              -f description="Autonomous production release" \
              -f payload="{\"run_url\":\"${RUN_URL}\"}" \
              -F auto_merge=false \
              -F transient_environment=false \
              -F production_environment=true \
              --jq '.id'
          )"
          echo "deployment_id=$deployment_id" >>"$GITHUB_OUTPUT"
          gh api --method POST \
            "repos/${REPOSITORY}/deployments/${deployment_id}/statuses" \
            -f state="in_progress" \
            -f log_url="$RUN_URL" \
            -f description="Production promotion started" >/dev/null

      - name: Recheck migration safety
        run: |
          scripts/release/check-migrations.sh \
            "${{ needs.plan.outputs.previous_production_sha }}" \
            "$TARGET_SHA"

      - name: Apply production migrations
        run: npm run db:migrate

      - name: Promote exact SHA to production
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="$(
            npx --yes vercel@59.26.0 deploy \
              --yes \
              --prod \
              --meta="releaseSha=${TARGET_SHA}" \
              --token="$VERCEL_TOKEN" |
              tail -n 1
          )"
          if [[ "$deployment_url" != https://* ]]; then
            echo "Vercel did not return a production deployment URL." >&2
            exit 1
          fi
          echo "deployment_url=$deployment_url" >>"$GITHUB_OUTPUT"
          vercel_deployment_id="$(
            npx --yes vercel@59.26.0 inspect "$deployment_url" \
              --wait \
              --timeout=5m \
              --json \
              --token="$VERCEL_TOKEN" |
              jq -er '.id'
          )"
          echo "vercel_deployment_id=$vercel_deployment_id" >>"$GITHUB_OUTPUT"

      - name: Run production health gate
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail
          scripts/release/probe-release.sh "$DEPLOYMENT_URL"
          if [ "${APP_URL%/}" != "${DEPLOYMENT_URL%/}" ]; then
            scripts/release/probe-release.sh "$APP_URL"
          fi

      - name: Abort rollout and roll back
        if: failure() && steps.deploy.outputs.deployment_url != ''
        shell: bash
        env:
          PREVIOUS_PRODUCTION_URL: ${{ needs.plan.outputs.previous_production_url }}
          VERCEL_DEPLOYMENT_ID: ${{ steps.deploy.outputs.vercel_deployment_id }}
        run: |
          set +e
          npx --yes vercel@59.26.0 rolling-release abort \
            --dpl="$VERCEL_DEPLOYMENT_ID" \
            --token="$VERCEL_TOKEN"
          abort_status=$?

          rollback_status=0
          if [ -n "$PREVIOUS_PRODUCTION_URL" ]; then
            npx --yes vercel@59.26.0 rollback "$PREVIOUS_PRODUCTION_URL" \
              --yes \
              --token="$VERCEL_TOKEN"
            rollback_status=$?
          else
            echo "::error::No previous successful production URL is recorded; automatic rollback is unavailable."
            rollback_status=1
          fi

          if [ "$abort_status" -ne 0 ]; then
            echo "::warning::No active rolling release was aborted, or Vercel was unavailable."
          fi
          exit "$rollback_status"

      - name: Record production deployment result
        if: always() && steps.github_deployment.outputs.deployment_id != ''
        shell: bash
        env:
          DEPLOYMENT_ID: ${{ steps.github_deployment.outputs.deployment_id }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state="failure"
          description="Production promotion or health gate failed"
          if [ "$JOB_STATUS" = "success" ]; then
            state="success"
            description="Production promotion and probes passed"
          fi
          arguments=(
            --method POST
            "repos/${REPOSITORY}/deployments/${DEPLOYMENT_ID}/statuses"
            -f "state=${state}"
            -f "log_url=${RUN_URL}"
            -f "description=${description}"
          )
          if [ -n "$DEPLOYMENT_URL" ]; then
            arguments+=(-f "environment_url=${DEPLOYMENT_URL}")
          fi
          gh api "${arguments[@]}" >/dev/null

      - name: Write production evidence
        if: always()
        shell: bash
        env:
          DEPLOYMENT_ID: ${{ steps.github_deployment.outputs.deployment_id }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
          JOB_STATUS: ${{ job.status }}
          PREVIOUS_SHA: ${{ needs.plan.outputs.previous_production_sha }}
          PREVIOUS_URL: ${{ needs.plan.outputs.previous_production_url }}
          VERCEL_DEPLOYMENT_ID: ${{ steps.deploy.outputs.vercel_deployment_id }}
        run: |
          jq -n \
            --arg deployment_id "$DEPLOYMENT_ID" \
            --arg deployment_url "$DEPLOYMENT_URL" \
            --arg vercel_deployment_id "$VERCEL_DEPLOYMENT_ID" \
            --arg environment_url "$APP_URL" \
            --arg environment "production" \
            --arg outcome "$JOB_STATUS" \
            --arg previous_sha "$PREVIOUS_SHA" \
            --arg previous_url "$PREVIOUS_URL" \
            --arg run_url "$RUN_URL" \
            --arg target_sha "$TARGET_SHA" \
            --arg timestamp "$(date -u +%FT%TZ)" \
            '{
              deployment_id: $deployment_id,
              deployment_url: $deployment_url,
              vercel_deployment_id: $vercel_deployment_id,
              environment_url: $environment_url,
              environment: $environment,
              outcome: $outcome,
              previous_production_sha: $previous_sha,
              previous_production_url: $previous_url,
              run_url: $run_url,
              target_sha: $target_sha,
              timestamp: $timestamp
            }' > production-release-evidence.json

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-release-evidence-${{ needs.plan.outputs.target_sha }}
          path: production-release-evidence.json
          retention-days: 90

      - name: Report production failure
        if: failure()
        env:
          RELEASE_PHASE: production
        run: scripts/release/incident.sh report "Production migration, promotion, health gate, abort, or rollback failed."

      - name: Resolve recovered release incident
        if: success()
        env:
          RELEASE_PHASE: production
        run: scripts/release/incident.sh resolve

  monitor:
    name: Monitor current production
    needs: plan
    if: needs.plan.outputs.release_required == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      APP_URL: ${{ vars.APP_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      TARGET_SHA: ${{ needs.plan.outputs.target_sha }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check out deployed SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.target_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate production bootstrap
        run: scripts/release/validate-config.sh production

      - name: Pull and validate current Vercel configuration
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@59.26.0 pull \
            --yes \
            --environment=production \
            --token="$VERCEL_TOKEN"
          scripts/release/validate-vercel-env.sh production

      - name: Run scheduled production probes
        run: scripts/release/probe-release.sh "$APP_URL"

      - name: Abort an unhealthy active rollout
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          vercel_deployment_id="$(
            npx --yes vercel@59.26.0 inspect "$APP_URL" \
              --json \
              --token="$VERCEL_TOKEN" |
              jq -er '.id'
          )"
          npx --yes vercel@59.26.0 rolling-release abort \
            --dpl="$vercel_deployment_id" \
            --token="$VERCEL_TOKEN"

      - name: Report production health failure
        if: failure()
        env:
          RELEASE_PHASE: production-monitor
        run: scripts/release/incident.sh report "Scheduled production health or safe synthetic probes failed. Any active rolling release was aborted; no version rollback was attempted without a newly promoted release to attribute."

      - name: Resolve recovered release incident
        if: success()
        env:
          RELEASE_PHASE: production-monitor
        run: scripts/release/incident.sh resolve
